fixed:
  type: confluent
prompts:
  _choose_compute_pool:
    "Use a specific compute pool":
      compute_pool_id:
        hint: "eg: lfcp-xxxxx"
    # 'Poolless': omitting compute_pool_id lets Confluent Cloud Flink run
    # statements in the default compute pool (provisioning one if necessary).
    # Empty mapping = no further prompts; compute_pool_id is left unset.
    "Use the environment+region default compute pool": {}
  environment_id:
    hint: "eg: env-xxxxxx"
  dbname:
    hint: "Database name"
  # Credentials come first: what can be inferred from the Kafka cluster named by `dbname`
  # (the organization, cloud provider and region) depends on them. Only a Global API key or
  # OAuth can infer; a Flink-region key can't, so it is asked for them outright.
  _choose_api_credentials:
    "Use a Global API key (works against every Confluent Cloud route)":
      global_api_key:
        hint: "Global API key"
      global_api_secret:
        hint: "Global API secret"
        hide_input: true
      organization_id:
        hint: "Optional, inferred if blank. eg: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
        default: ""
      _choose_backend_url:
        "Infer cloud_provider and cloud_region from the Kafka cluster named by dbname": {}
        "Use cloud_provider and cloud_region": &provider_and_region
          cloud_provider:
            hint: "eg: 'aws'"
            default: "aws"
          cloud_region:
            hint: "eg: us-west-1"
            default: "us-west-1"
        "Use a custom endpoint": &custom_endpoint
          endpoint:
            hint: "eg: https://flink.us-east-2.aws.private.confluent.cloud"
    "Use a Flink-region API key":
      flink_api_key:
        hint: "Flink API key"
      flink_api_secret:
        hint: "Flink API secret"
        hide_input: true
      organization_id:
        hint: "Required with a Flink API key. eg: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
      _choose_backend_url:
        "Use cloud_provider and cloud_region": *provider_and_region
        "Use a custom endpoint": *custom_endpoint
    "Use OAuth (interactive Confluent Cloud sign-in, no API key)":
      _fixed_auth: oauth
      organization_id:
        hint: "Optional, inferred from the login if blank. eg: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
        default: ""
      _choose_backend_url:
        "Infer cloud_provider and cloud_region from the Kafka cluster named by dbname": {}
        "Use cloud_provider and cloud_region": *provider_and_region
        "Use a custom endpoint": *custom_endpoint
  execution_mode:
    hint: "One of: 'snapshot', 'snapshot_ddl', 'streaming_query', 'streaming_ddl'"
    type: "string"
    default: 'streaming_query'
  statement_name_prefix:
    hint: "Prefix for statement names (project name is appended automatically)"
    type: "string"
    default: "dbt-"
  name_prefix:
    hint: "Optional prefix isolating tables and statements, e.g. 'alice-'"
    type: "string"
    default: ""
  statement_label:
    hint: "A user label applied to all statements"
    type: "string"
    default: "dbt-confluent"
  threads:
    hint: "1 or more"
    type: "int"
    default: 1
