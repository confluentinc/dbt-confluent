version: v1.0
name: build-test-release
agent:
  machine:
    type: s1-prod-ubuntu24-04-amd64-1

auto_cancel:
  running:
    when: "branch != 'main'"

execution_time_limit:
  hours: 1

queue:
  - when: "branch != 'main'"
    processing: parallel

global_job_config:
  prologue:
    commands:
      - checkout
      - git submodule update --init
      - curl -LsSf https://astral.sh/uv/install.sh | sh
      - uv sync --dev --frozen

blocks:
  - name: "Lint"
    dependencies: []
    task:
      jobs:
        - name: "Ruff Check"
          commands:
            - uv run --frozen poe ruff-check
        - name: "Ruff Format Check"
          commands:
            - uv run --frozen poe ruff-format-check
        - name: "Mypy Check"
          commands:
            - uv run --frozen poe mypy
        - name: "Changelog Check"
          commands:
            - uv run --frozen poe changelog-check

  - name: "Build"
    dependencies: []
    task:
      jobs:
        - name: "Build Package"
          commands:
            - uv build

  - name: "Test"
    dependencies: []
    task:
      jobs:
        # UV_PYTHON is what uv reads, so the matrix variable is that itself; the global prologue's
        # `uv sync` honors it. `-e simple` runs the task in that already-synced environment: poe's
        # uv executor would otherwise pin the interpreter (poe_tasks.toml) and override UV_PYTHON.
        - name: "Unit Tests (locked)"
          matrix:
            - env_var: UV_PYTHON
              values: ["3.10", "3.11", "3.12", "3.13"]
          commands:
            - uv run --frozen poe -e simple unit
        # These two jobs re-resolve instead of using uv.lock's direct file URLs, and the CI package
        # mirror returns no versions for confluent-sql, so they resolve against PyPI itself.
        # The lowest versions our declared bounds allow for every direct dependency (#128).
        - name: "Unit Tests (lowest dependencies)"
          matrix:
            - env_var: UV_PYTHON
              values: ["3.10", "3.13"]
          commands:
            - UV_NO_CONFIG=1 uv sync --dev --resolution lowest-direct --default-index https://pypi.org/simple
            - uv run --no-sync poe -e simple unit
        # The newest versions our declared bounds allow, ignoring uv.lock, so a release inside the
        # bounds that breaks us fails CI instead of a user's fresh install.
        - name: "Unit Tests (highest dependencies)"
          matrix:
            - env_var: UV_PYTHON
              values: ["3.10", "3.13"]
          commands:
            - UV_NO_CONFIG=1 uv sync --dev --upgrade --default-index https://pypi.org/simple
            - uv run --no-sync poe -e simple unit
      epilogue:
        always:
          commands:
            - |
              if [[ -f test-results.xml ]]; then
                test-results publish test-results.xml
              fi

after_pipeline:
  task:
    jobs:
      - name: Publish Test Results to Semaphore
        commands:
          - test-results gen-pipeline-report || echo "Could not publish pipeline test result report. Are there any test results to publish?"

promotions:
  - name: Publish dbt-confluent to PyPi
    pipeline_file: publish_to_pypi.yml
