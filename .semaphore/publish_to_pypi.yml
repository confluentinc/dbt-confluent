
version: v1.0
name: Publish `dbt_confluent` to PyPi
agent:
  machine:
    type: s1-prod-ubuntu24-04-amd64-1

global_job_config:
  prologue:
    commands:
      - checkout
      - curl -LsSf https://astral.sh/uv/install.sh | sh

blocks:
  - name: Publish `dbt_confluent` to PyPi
    task:
      jobs:
        - name: Publish `dbt_confluent` to PyPi
          commands:
            - . vault-get-secret --secret-key=pypi_token --export-as=DBT_CONFLUENT_KEY pypi/dbt-confluent
            - uv build
            - uv publish -u __token__ -p "$DBT_CONFLUENT_KEY" dist/*
