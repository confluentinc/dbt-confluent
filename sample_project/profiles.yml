tableflow_sample:
  target: default
  outputs:
    default:
      type: confluent
      threads: 1
      auth: oauth
      # global_api_key: "{{ env_var('CONFLUENT_FLINK_API_KEY') }}"
      # global_api_secret: "{{ env_var('CONFLUENT_FLINK_API_SECRET') }}"
      host: "https://flink.{{ env_var('CONFLUENT_CLOUD_REGION') }}.{{ env_var('CONFLUENT_CLOUD_PROVIDER') }}.confluent.cloud"
      cloud_provider: "{{ env_var('CONFLUENT_CLOUD_PROVIDER') }}"
      cloud_region: "{{ env_var('CONFLUENT_CLOUD_REGION') }}"
      compute_pool_id: "{{ env_var('CONFLUENT_COMPUTE_POOL_ID') }}"
      organization_id: "{{ env_var('CONFLUENT_ORG_ID') }}"
      database: "{{ env_var('CONFLUENT_ENV_ID') }}"
      schema: "{{ env_var('CONFLUENT_TEST_DBNAME') }}"
      statement_name_prefix: "{{ env_var('BUGBASH_USER', env_var('USER')) }}-bug-bash-tableflow-oauth-2026-09-"
      statement_label: "{{ env_var('BUGBASH_USER', env_var('USER')) }}-bug-bash-tableflow-oauth-2026-09"
